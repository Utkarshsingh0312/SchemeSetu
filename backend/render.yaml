services:
  - type: web
    name: schemesetu-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schemesetu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://schemesetu.vercel.app

databases:
  - name: schemesetu-db
    databaseName: schemesetu
    user: schemesetu_user
